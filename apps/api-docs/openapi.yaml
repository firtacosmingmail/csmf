openapi: 3.0.3
info:
  title: csmf.ro API
  description: >
    REST API surface exposed by Supabase Edge Functions
    (`apps/supabase/functions/`). This is the only path the web app (and any
    other client) uses to read/write the database — RLS is still the real
    enforcement layer, but every request goes through a function, not
    PostgREST directly. Auth is the one exception: Supabase Auth is called
    directly from the web app (see `apps/web/lib/supabase/`), not wrapped by
    this API.

    Keep this file in sync with `apps/supabase/functions/`: whenever a
    function route is added, removed, or changed, update this spec in the
    same change.
  version: "0.1.0"
servers:
  - url: https://{project_ref}.supabase.co/functions/v1
    variables:
      project_ref:
        default: ieidicunbwtmdingurgt
        description: Supabase project ref (dev by default).
security:
  - apikey: []
tags:
  - name: hello
    description: >
      Throwaway/example function proving the Edge Functions + Hono wiring,
      and the shared request-scoped client
      (`apps/supabase/functions/_shared/client.ts`) that forwards the
      caller's Authorization header so RLS applies as the caller.
  - name: posts
    description: The `posts` Edge Function (`apps/supabase/functions/posts/`).
  - name: blocks
    description: The `blocks` Edge Function (`apps/supabase/functions/blocks/`).
  - name: images
    description: The `images` Edge Function (`apps/supabase/functions/images/`).
  - name: about-me
    description: The `about-me` Edge Function (`apps/supabase/functions/about-me/`).
  - name: social-links
    description: The `social-links` Edge Function (`apps/supabase/functions/social-links/`).
  - name: work-experience
    description: >
      The `work-experience` Edge Function
      (`apps/supabase/functions/work-experience/`).
  - name: newsletter
    description: >
      The `newsletter` Edge Function
      (`apps/supabase/functions/newsletter/`). v1 is capture-only — no
      admin routes yet, and no send-on-publish (that needs an email
      provider, still undecided).
  - name: comments
    description: >
      The `comments` Edge Function (`apps/supabase/functions/comments/`) —
      the cross-post admin moderation queue. Public submission and a
      single post's approved comments are under `posts` instead (`GET`/
      `POST /posts/{id}/comments`).
paths:
  /posts:
    get:
      tags: [posts]
      summary: List posts
      description: >
        RLS-scoped: anonymous callers only ever see published posts,
        regardless of `?status=`; an authenticated admin session sees
        everything, optionally filtered by `?status=`, `?pinned=`,
        `?locale=`, `?translation_group_id=`, or a single `?id=`. Pass
        `?page=` (1-indexed; `?per_page=` defaults to 6) to paginate — the
        response then includes `total`; omit it for the unpaginated admin
        list behavior.
      operationId: listPosts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published]
        - name: id
          in: query
          schema:
            type: string
            format: uuid
        - name: pinned
          in: query
          schema:
            type: boolean
        - name: locale
          in: query
          schema:
            type: string
            enum: [en, ro]
        - name: translation_group_id
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 6
      security:
        - apikey: []
        - apikey: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  total:
                    type: integer
                    description: Only present when `?page=` was given.
        "500":
          description: Query error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [posts]
      summary: Create a post
      description: >
        Admin only — RLS rejects an anonymous caller's insert with 403. New
        posts start with zero blocks (the block editor adds those later).
      operationId: createPost
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: "#/components/schemas/Post"
        "400":
          description: Missing required field, or an invalid status value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not authorized (RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /posts/{id}:
    get:
      tags: [posts]
      summary: Get a post by slug, with its ordered blocks
      description: >
        RLS-scoped: anonymous callers only ever get a published post (a
        draft's slug 404s for them); an authenticated admin session can
        fetch any post regardless of status. Slugs are only unique per
        locale, so `?locale=` (defaulting to "en") picks which language's
        post to look up.

        Note: despite the shared `{id}` path parameter name (this and the
        PATCH/DELETE operations below all resolve to the same URL shape, so
        OpenAPI treats them as one path), this parameter is actually the
        post's **slug**, not its UUID id.
      operationId: getPostBySlug
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The post's slug.
        - name: locale
          in: query
          schema:
            type: string
            enum: [en, ro]
            default: en
      security:
        - apikey: []
        - apikey: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: "#/components/schemas/PostWithBlocks"
        "404":
          description: Not found (or not visible to this caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Query error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [posts]
      summary: Update a post's metadata
      description: >
        Admin only. Accepts any subset of title/subtitle/slug/status/pinned;
        unknown fields are ignored. `published_at` is set automatically the
        first time status transitions to `published`.
      operationId: updatePost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: "#/components/schemas/Post"
        "400":
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [posts]
      summary: Delete a post
      description: Admin only. Cascades to the post's blocks and comments.
      operationId: deletePost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /posts/{id}/preview-image:
    patch:
      tags: [posts]
      summary: Set or clear a post's preview image
      description: >
        Admin only. `preview_image_block_id` must be the id of an `image`
        block belonging to this post, or `null` to clear it. Denormalizes
        that block's `url`/`alt_text` onto `posts.preview_image_url`/
        `preview_image_alt` so listings never need to join `post_blocks`
        just for a thumbnail.
      operationId: setPostPreviewImage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preview_image_block_id]
              properties:
                preview_image_block_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    $ref: "#/components/schemas/Post"
        "400":
          description: >
            preview_image_block_id isn't a string/null, or doesn't
            reference an image block belonging to this post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /posts/{id}/blocks:
    post:
      tags: [posts, blocks]
      summary: Add a block to a post
      description: >
        Admin only — RLS rejects an anonymous caller's insert with 403.
        `content` is validated against `type` with Zod:
        `heading`/`subheading`/`paragraph` (`{text}`), `code` (`{code,
        language}`), `separator` (`{}`), or `image` (`{url, alt_text?,
        caption?, source_text?, source_url?}` — get `url` from `POST
        /images` first). Omit `display_order` to default to 0. The first
        `image` block added to a post automatically becomes its preview
        image (only if one isn't already set — never overrides an explicit
        `PATCH /posts/{id}/preview-image`).
      operationId: createPostBlock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: The post's id (not slug).
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostBlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  block:
                    $ref: "#/components/schemas/PostBlock"
        "400":
          description: Missing type, or content doesn't match the type's shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not authorized (RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /blocks/{id}:
    patch:
      tags: [blocks]
      summary: Update a block's content and/or position
      description: >
        Admin only. `type` is immutable once a block is created — delete and
        re-insert to change it. `content`, if present, is validated against
        the block's existing type. `display_order` (if a number) is
        accepted as-is for reordering.
      operationId: updatePostBlock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: object
                display_order:
                  type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  block:
                    $ref: "#/components/schemas/PostBlock"
        "400":
          description: Content doesn't match the block's type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [blocks]
      summary: Delete a block
      description: Admin only.
      operationId: deletePostBlock
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /images:
    post:
      tags: [images]
      summary: Upload an image
      description: >
        Admin only — RLS on `storage.objects` rejects an anonymous upload.
        Multipart body with a `file` field; the response's `url` is what an
        `image` block's `content.url` should be set to (via `POST
        /posts/{id}/blocks` or `PATCH /blocks/{id}`).
      operationId: uploadImage
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  width:
                    type: integer
                  height:
                    type: integer
        "400":
          description: Missing file, or not a valid image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not authorized (RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /about-me:
    get:
      tags: [about-me]
      summary: Get the about_me row for a locale
      description: >
        Public — RLS allows anon reads. Pass `?locale=` to get that
        locale's row (`about_me` is `null` until one has been saved);
        omitting it is an admin-only shape that returns every locale's row
        as an array instead.
      operationId: getAboutMe
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            enum: [en, ro]
      security:
        - apikey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  about_me:
                    description: >
                      A single (possibly null) row when `?locale=` was
                      given, otherwise an array of every locale's row.
                    oneOf:
                      - $ref: "#/components/schemas/AboutMe"
                        nullable: true
                      - type: array
                        items:
                          $ref: "#/components/schemas/AboutMe"
        "400":
          description: Invalid locale value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Query error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [about-me]
      summary: Upsert a locale's about_me row
      description: >
        Admin only. `locale` is required; the rest (headline/bio/
        avatar_url/contact_email) is any subset. Upserts that locale's row,
        so it works whether or not one already exists. Get avatar_url from
        `POST /images` first.
      operationId: updateAboutMe
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutMeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  about_me:
                    $ref: "#/components/schemas/AboutMe"
        "400":
          description: Invalid contact_email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not authorized (RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /social-links:
    get:
      tags: [social-links]
      summary: List social links
      description: Public — RLS allows anon reads. Ordered by display_order.
      operationId: listSocialLinks
      security:
        - apikey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  social_links:
                    type: array
                    items:
                      $ref: "#/components/schemas/SocialLink"
        "500":
          description: Query error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [social-links]
      summary: Create a social link
      description: Admin only — RLS rejects an anonymous insert with 403.
      operationId: createSocialLink
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  social_link:
                    $ref: "#/components/schemas/SocialLink"
        "400":
          description: Missing/invalid platform or url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not authorized (RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /social-links/{id}:
    patch:
      tags: [social-links]
      summary: Update a social link
      description: Admin only. Accepts any subset of platform/url/display_order.
      operationId: updateSocialLink
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialLinkInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  social_link:
                    $ref: "#/components/schemas/SocialLink"
        "400":
          description: Invalid field value, or an unknown field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [social-links]
      summary: Delete a social link
      description: Admin only.
      operationId: deleteSocialLink
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /work-experience:
    get:
      tags: [work-experience]
      summary: List work experience entries
      description: >
        Public — RLS allows anon reads. Ordered by display_order. Pass
        `?locale=` to scope to one language's entries — omit it to get
        every locale's entries (the admin editor groups these by
        translation_group_id).
      operationId: listWorkExperience
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            enum: [en, ro]
      security:
        - apikey: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_experience:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkExperience"
        "500":
          description: Query error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [work-experience]
      summary: Create a work experience entry
      description: Admin only — RLS rejects an anonymous insert with 403.
      operationId: createWorkExperience
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkExperienceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_experience:
                    $ref: "#/components/schemas/WorkExperience"
        "400":
          description: Missing/invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not authorized (RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /work-experience/{id}:
    patch:
      tags: [work-experience]
      summary: Update a work experience entry
      description: >
        Admin only. Accepts any subset of company/role/description/
        start_date/end_date/display_order — used both for field edits and
        for drag-to-reorder (display_order only).
      operationId: updateWorkExperience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkExperienceInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  work_experience:
                    $ref: "#/components/schemas/WorkExperience"
        "400":
          description: Invalid field value, or an unknown field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [work-experience]
      summary: Delete a work experience entry
      description: Admin only.
      operationId: deleteWorkExperience
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /posts/{id}/comments:
    get:
      tags: [posts]
      summary: List a post's comments
      description: >
        Newest-first. Defaults to approved only (public use) — RLS backs
        that up too. `?status=` (admin use) shows a different subset; an
        anon caller still only ever gets approved rows back regardless of
        what they pass, since RLS doesn't key off this param.
      operationId: listPostComments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
            default: approved
      security:
        - apikey: []
        - apikey: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
        "500":
          description: Query error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [posts]
      summary: Submit a comment
      description: >
        Public. Always inserted as `status: "pending"` — a spoofed `status`
        field in the body 400s (the schema doesn't accept it), and RLS's
        own with-check independently pins public inserts to pending too.
        The response echoes the submitted fields rather than reading the
        row back (RLS's SELECT policy only allows `approved`, so a
        `pending` row can't be read back right after inserting it) — no
        `id`/`created_at` in the response.
      operationId: createPostComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment:
                    $ref: "#/components/schemas/Comment"
        "400":
          description: Missing/invalid author_name, author_email, or body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /comments:
    get:
      tags: [comments]
      summary: Cross-post moderation queue
      description: >
        Admin only in practice — RLS's "public read approved comments"
        limits an anon caller to approved rows regardless of `?status=`.
        Embeds each comment's post (title/slug) so the moderation UI can
        show which post it's on in one call.
      operationId: listComments
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      security:
        - apikey: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/CommentWithPost"
        "500":
          description: Query error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /comments/{id}:
    patch:
      tags: [comments]
      summary: Moderate a comment
      description: Admin only. Sets status to pending, approved, or rejected.
      operationId: moderateComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, approved, rejected]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment:
                    $ref: "#/components/schemas/Comment"
        "400":
          description: Missing/invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [comments]
      summary: Delete a comment
      description: Admin only.
      operationId: deleteComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - apikey: []
          bearerAuth: []
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found (or not visible to this caller — RLS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /newsletter/subscribe:
    post:
      tags: [newsletter]
      summary: Subscribe to the newsletter
      description: >
        Public. Always inserted as status='active' — a spoofed status 400s
        (the schema doesn't accept it), backed independently by RLS's own
        with-check. A duplicate email is treated as a no-op success
        (avoids leaking whether an address is already subscribed) rather
        than an error.
      operationId: subscribeToNewsletter
      security:
        - apikey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "201":
          description: Subscribed (or already was)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "400":
          description: Missing/invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /hello:
    get:
      tags: [hello]
      summary: Health check
      operationId: getHello
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: hello from edge functions
  /hello/posts:
    get:
      tags: [hello]
      summary: List posts, scoped to the caller (RLS demo)
      description: >
        Anonymous callers see only published posts; an authenticated admin
        session sees drafts too. Demonstrates the shared scoped-client
        pattern every future data-access route should follow.
      operationId: getHelloPosts
      security:
        - apikey: []
        - apikey: []
          bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostSummary"
        "500":
          description: Query error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase anon/publishable key.
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        End user's session access token. Forwarded by the shared client so
        RLS evaluates as that caller instead of the function's own role.
  schemas:
    PostSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, published]
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        slug:
          type: string
        status:
          type: string
          enum: [draft, published]
        pinned:
          type: boolean
        preview_image_url:
          type: string
          nullable: true
        preview_image_alt:
          type: string
          nullable: true
        preview_image_block_id:
          type: string
          format: uuid
          nullable: true
        published_at:
          type: string
          format: date-time
          nullable: true
        locale:
          type: string
          enum: [en, ro]
        translation_group_id:
          type: string
          format: uuid
          description: Shared by this post and its translation(s), if any.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PostInput:
      type: object
      description: >
        POST requires title and slug; PATCH accepts any subset of these
        fields. `locale` and `translation_group_id` are create-only (POST) —
        PATCH ignores them, since a post's translation identity doesn't
        change after creation. `locale` defaults to "en"; pass an existing
        post's `translation_group_id` to create this one as its translation.
      properties:
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        slug:
          type: string
        status:
          type: string
          enum: [draft, published]
        pinned:
          type: boolean
        locale:
          type: string
          enum: [en, ro]
        translation_group_id:
          type: string
          format: uuid
    PostBlock:
      type: object
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [heading, subheading, paragraph, code, separator, image]
        display_order:
          type: integer
        content:
          type: object
          description: >
            Shape depends on `type`: `{text}` (heading/subheading/paragraph),
            `{code, language}`, `{url, alt_text, caption, source_text,
            source_url}` (image), or `{}` (separator).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PostBlockInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [heading, subheading, paragraph, code, separator, image]
        content:
          type: object
          description: >
            Must match `type`'s shape: `{text}` (heading/subheading/
            paragraph), `{code, language}` (code), `{}` (separator), or
            `{url, alt_text?, caption?, source_text?, source_url?}` (image).
        display_order:
          type: integer
    PostWithBlocks:
      allOf:
        - $ref: "#/components/schemas/Post"
        - type: object
          properties:
            post_blocks:
              type: array
              items:
                $ref: "#/components/schemas/PostBlock"
            translations:
              type: array
              description: >
                Other locales' published rows sharing this post's
                translation_group_id, as {locale, slug} — enough to link
                straight to the translation.
              items:
                type: object
                properties:
                  locale:
                    type: string
                    enum: [en, ro]
                  slug:
                    type: string
    AboutMe:
      type: object
      properties:
        locale:
          type: string
          enum: [en, ro]
          description: Primary key — one row per locale.
        headline:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        contact_email:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AboutMeInput:
      type: object
      description: >
        `locale` is required (it's the row's primary key); the rest are any
        subset — PUT upserts, so partial updates work.
      required: [locale]
      properties:
        locale:
          type: string
          enum: [en, ro]
        headline:
          type: string
        bio:
          type: string
          description: HTML from the admin bio's rich text editor.
        avatar_url:
          type: string
        contact_email:
          type: string
    SocialLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
        url:
          type: string
        display_order:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SocialLinkInput:
      type: object
      description: >
        POST requires platform and url; PATCH accepts any subset of
        platform/url/display_order.
      properties:
        platform:
          type: string
        url:
          type: string
        display_order:
          type: integer
    WorkExperience:
      type: object
      properties:
        id:
          type: string
          format: uuid
        company:
          type: string
        role:
          type: string
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
          description: Null for an ongoing role.
        display_order:
          type: integer
        locale:
          type: string
          enum: [en, ro]
        translation_group_id:
          type: string
          format: uuid
          description: Shared by this entry and its translation(s), if any.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkExperienceInput:
      type: object
      description: >
        POST requires company and role; PATCH accepts any subset of
        company/role/description/start_date/end_date/display_order/locale/
        translation_group_id. `locale` defaults to "en"; pass an existing
        entry's `translation_group_id` to create this one as its
        translation.
      properties:
        company:
          type: string
        role:
          type: string
        description:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        display_order:
          type: integer
        locale:
          type: string
          enum: [en, ro]
        translation_group_id:
          type: string
          format: uuid
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        author_name:
          type: string
        author_email:
          type: string
          nullable: true
        body:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
          format: date-time
    CommentWithPost:
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          properties:
            posts:
              type: object
              description: Embedded via the post_id foreign key.
              properties:
                title:
                  type: string
                slug:
                  type: string
    CommentInput:
      type: object
      required: [author_name, body]
      properties:
        author_name:
          type: string
        author_email:
          type: string
          description: Optional; must be a valid email if given.
        body:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
